name: Release

# This repository has a single long-lived branch, so there is no develop ->
# master merge to hang a release on. A release is therefore something a person
# decides to cut, not something a push implies, and it is triggered by hand.
on:
  workflow_dispatch:

permissions:
  # The job pushes the version-bump commits and the release tag.
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    container:
      image: srnjak/ci-builder-maven:3.9.6-jdk21-9
    timeout-minutes: 60

    steps:
      - name: Refuse to release from a branch other than master
        if: github.ref != 'refs/heads/master'
        run: |
          echo "Releases are cut from master; this run is on ${{ github.ref }}." >&2
          exit 1

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Ensures full history for tagging

      - name: Set up cache
        uses: actions/cache@v4
        with:
          path: /root/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Set up environment variables
        run: |
          echo 'CENTRAL_USERNAME_PARAM=${{ vars.CENTRAL_USERNAME_PARAM }}' >> $GITHUB_ENV
          echo 'CENTRAL_PASSWORD_PARAM=${{ secrets.CENTRAL_PASSWORD_PARAM }}' >> $GITHUB_ENV

      - name: Configure Git
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name github-actions
          git config user.email github-actions@github.com
          git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "git@github.com:"
          git remote set-url origin https://github.com/${{ github.repository }}.git

      - name: Import GPG key
        run: |
          echo ${{ secrets.GPG_PRIVATE_KEY }} | base64 --decode | gpg --batch --import

      # Everything up to and including signing is exercised before master is
      # touched, so a failing build cannot leave a release-version commit
      # behind on the branch.
      - name: Build, test and sign
        run: |
          mvn -B clean verify -s mvn-settings.xml -Dgpg.passphrase="${{ secrets.GPG_PASSPHRASE }}"

      - name: Prepare release version
        run: |
          mvn -B versions:set -s mvn-settings.xml -DremoveSnapshot=true -DgenerateBackupPoms=false
          mvn -B scm:checkin -s mvn-settings.xml -Dmessage="[release] Release version prepared."

      - name: Publish to Maven Central
        run: |
          mvn -B clean scm:tag deploy -s mvn-settings.xml -Dgpg.passphrase="${{ secrets.GPG_PASSPHRASE }}"

      - name: Prepare next snapshot version
        run: |
          mvn -B versions:set -s mvn-settings.xml -DnextSnapshot=true -DgenerateBackupPoms=false
          mvn -B scm:checkin -s mvn-settings.xml -Dmessage="[release] New snapshot version prepared."
